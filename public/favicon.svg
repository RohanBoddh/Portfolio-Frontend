<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#040a14"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Letter R Gradient -->
    <linearGradient id="rGrad" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Dot Glow -->
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Code / Tech Accent Elements (Subtle Top-Right & Bottom-Left) -->
  <path d="M46 12 L51 17 L46 22" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <path d="M18 42 L13 47 L18 52" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Stylized Geometric "R" Monogram -->
  <g filter="url(#cyanGlow)">
    <!-- Vertical Spine -->
    <path d="M21 17 C21 15.895 21.895 15 23 15 H33.5 C39.299 15 44 19.477 44 25 C44 30.133 40.038 34.364 34.8 34.93 L43.5 47.3 C44.1 48.16 43.48 49 42.42 49 H36.8 C36.05 49 35.35 48.61 34.92 48 L27.5 35.8 H26.5 V47.5 C26.5 48.33 25.83 49 25 49 H22.5 C21.67 49 21 48.33 21 47.5 V17 Z M26.5 29.8 H33.2 C36.18 29.8 38.5 27.65 38.5 25 C38.5 22.35 36.18 20.2 33.2 20.2 H26.5 V29.8 Z" fill="url(#rGrad)"/>
  </g>

  <!-- Tech Cyan Dot (matching "Rohan.") -->
  <circle cx="47" cy="46" r="3.2" fill="url(#dotGrad)"/>
  <circle cx="47" cy="46" r="5" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
</svg>